# Minecraft 26.3 Version Configuration

# Core version
minecraft_version=26.3
pack_format=[94, 1]
java_version=25

# Loader versions
fabric_loader_version=0.19.3
neoforge_version=26.3.0.3-beta
# forge_version / forge_major_version omitted: no Forge build published for 26.3 yet

# API versions
fabric_api_version=0.160.7+26.3

# Platforms
enabled_platforms=fabric,neoforge

# Build options
# MC 26.x ships without obfuscation - no Mojang mappings in version manifest
use_mojang_mappings=false
