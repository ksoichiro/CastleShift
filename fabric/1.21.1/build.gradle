plugins {
    id 'dev.architectury.loom'
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    testCompileClasspath.extendsFrom common
    testRuntimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

def commonModule = ':common-1.21.1'

repositories {
    // ModMenu (optional, compile-only integration)
    maven { url 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modApi "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: commonModule, configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: commonModule, configuration: 'transformProductionFabric')

    // night-config: Fabric does not ship it, so bundle it into the mod jar.
    modImplementation include("com.electronwill.night-config:core:${rootProject.night_config_version}")
    modImplementation include("com.electronwill.night-config:toml:${rootProject.night_config_version}")

    // ModMenu: compile-only, so the mod builds and runs fine without it installed.
    modCompileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    // fabric-loader-junit launches tests through Knot, so mixins are applied. Used to test
    // ChunkGeneratorMixin, which common-1.21.1's plain JUnit run cannot see.
    testImplementation "net.fabricmc:fabric-loader-junit:$rootProject.fabric_loader_version"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDir '../base/src/main/java'
            // Optional ModMenu integration (compiled against modCompileOnly ModMenu).
            srcDir '../base-modmenu/src/main/java'
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir '../base/src/main/resources'
        }
    }
}

loom {
    if (project(commonModule).loom.accessWidenerPath != null) {
        accessWidenerPath = project(commonModule).loom.accessWidenerPath
    }

    runs {
        client {
            client()
            runDir("run")
        }
        server {
            server()
            runDir("run")
        }
    }
}

processResources {
    from(project(commonModule).sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveBaseName = rootProject.archives_name
    archiveVersion = "${rootProject.mod_version}+${rootProject.ext.minecraft_version}-fabric"
    archiveClassifier = null
}

java {
    withSourcesJar()
}

tasks.named('sourcesJar').configure {
    archiveBaseName = rootProject.archives_name
    archiveVersion = "${rootProject.mod_version}+${rootProject.ext.minecraft_version}-fabric"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('remapSourcesJar').configure {
    archiveBaseName = rootProject.archives_name
    archiveVersion = "${rootProject.mod_version}+${rootProject.ext.minecraft_version}-fabric"
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = "${rootProject.archives_name}-fabric"
            from components.java
        }
    }

    repositories {
    }
}
